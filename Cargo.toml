[package]
name = "discord-tts"
version = "0.25.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
once_cell = "1.19.0"
regex = "1.10.4"
rustls = "0.23.41"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.116"
serenity = { version = "0.12.1", features = [
    "cache",
    "client",
    "voice",
    "rustls_backend",
], default-features = false }
songbird = { version = "0.6.0", features = [
    "builtin-queue",
    "gateway",
    "serenity",
    "driver",
    "rustls",
    "tungstenite",
], default-features = false }
# Songbird 0.6.0 depends on symphonia-core 0.5.5, we need this version for WavSource
symphonia-core-0-5 = { package = "symphonia-core", version = "0.5.5" }
symphonia-0-5 = { package = "symphonia", version = "0.5.5", features = [
    "pcm",
], default-features = false }
tokio = { version = "1.37.0", features = [
    "macros",
    "rt-multi-thread",
    "signal",
] }
tracing-subscriber = "0.3.18"
hound = "3.5.1"
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive", "env"] }
tts-bot-core = { path = "../tts-bot-core" }

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
